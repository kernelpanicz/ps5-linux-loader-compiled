
name: Build PS5 Linux Loader

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout loader
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget unzip clang-18 lld-18

      - name: Install PS5 Payload SDK
        run: |
          wget -q \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip \
            -O /tmp/ps5-payload-sdk.zip

          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt

          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk

      - name: Build ELF
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: ps5-linux-loader-elf
          path: bin/ps5-linux-loader.elf
          if-no-files-found: error
          retention-days: 7
